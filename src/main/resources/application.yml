spring:
  application:
    name: springboot_cqrs_command
  config:
    import: optional:file:env.properties
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 120000
      max-lifetime: 540000
      keepalive-time: 30000
      leak-detection-threshold: 0
  flyway:
    enabled: true
    baseline-version: 1
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN}/
          audiences:
          - https://choudai-matketplace.jp.auth0.com/api/v2/
          - https://choudai-matketplace.jp.auth0.com/userinfo

  profiles:
    active: [dev, prod]

management:
  otlp:
    logging:
      endpoint: http://otel-collector:4317

okta:
  oauth2:
    issuer: https://${AUTH0_DOMAIN}/
    client-id: ${AUTH0_CLIENT_ID}
    client-secret: ${AUTH0_CLIENT_SECRET}

server:
  port: 8080
  servlet:
    context-path: /command
